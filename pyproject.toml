[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "svea-eval"
version = "0.1.4"
description = "Swedish-first capability evaluation for local and API language models"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Birger Moëll"}]
keywords = ["evaluation", "llm", "swedish", "benchmark", "nlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
local = ["accelerate>=0.30", "torch>=2.2", "transformers>=4.45"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
svea = "svea_eval.cli:main"

[project.urls]
Homepage = "https://birgermoell.github.io/svea-eval/"
Repository = "https://github.com/BirgerMoell/svea-eval"
Issues = "https://github.com/BirgerMoell/svea-eval/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
svea_eval = ["resources/**/*.json", "resources/**/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
